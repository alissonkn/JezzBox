<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JezzBox</title>
    <meta name="description" content="JezzBox - the original 1992 Windows JezzBall game, faithfully ported to the browser with original assets, menus, and graphics.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wrap">
        <header>
            <h1>JezzBox</h1>
        </header>
        <div class="menu-bar">
            <div class="menu">
                <span class="menu-title">Game</span>
                <div class="menu-dropdown">
                    <div class="menu-item" onclick="newGame()">New Game&#9;&#160;F2</div>
                    <div class="menu-item" onclick="togglePause()">Pause&#9;&#160;F3</div>
                    <div class="menu-separator"></div>
                    <div class="menu-item" onclick="showHighScores()">High Scores...</div>
                    <div class="menu-separator"></div>
                    <div class="menu-item" onclick="exitGame()">Exit</div>
                </div>
            </div>
            <div class="menu">
                <span class="menu-title">Options</span>
                <div class="menu-dropdown">
                    <div class="menu-item" id="menu-slow">Slow</div>
                    <div class="menu-item" id="menu-fast">Fast</div>
                    <div class="menu-separator"></div>
                    <div class="menu-item" id="menu-sound">Sound</div>
                </div>
            </div>
            <div class="menu">
                <span class="menu-title">Help</span>
                <div class="menu-dropdown">
                    <div class="menu-item" onclick="showHelp('contents')">Contents&#9;&#160;F1</div>
                    <div class="menu-item" onclick="showHelp('howtoplay')">How To Play</div>
                    <div class="menu-item" onclick="showHelp('commands')">Commands</div>
                    <div class="menu-item" onclick="showHelp('usehelp')">How To Use Help</div>
                    <div class="menu-separator"></div>
                    <div class="menu-item" onclick="showAbout()">About JezzBox...</div>
                </div>
            </div>
        </div>
        <div class="board-wrap">
            <canvas id="game" width="517" height="374"></canvas>
            <div id="overlay" class="overlay hidden">
                <div class="overlay-content" id="overlay-content"></div>
            </div>
        </div>
        <div class="controls">
            <p>Click to start a cut &bull; Right-click to toggle orientation &bull; <kbd>V</kbd> toggle orientation &bull; <kbd>F</kbd> fast/slow &bull; <kbd>P</kbd> pause &bull; <kbd>F2</kbd> new game &bull; <kbd>F3</kbd> pause</p>
        </div>
    </div>
    <script src="jezzbox.js"></script>
    <script src="main.js"></script>
</body>
</html>
